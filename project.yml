name: CouchStain
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.couchstain
    APP_STORE_ID: "6838423986"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  CouchStain:
    type: application
    platform: iOS
    sources:
      - path: CouchStain
        excludes: [PrivacyInfo.xcprivacy]
      - path: CouchStain/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: CouchStain AppStore
    info:
      path: CouchStain/Info.plist
      properties:
        CFBundleDisplayName: Couch Stain Rescue
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Couch Care Card
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.couchstain.card]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.couchstain.card
            UTTypeConformsTo: [public.plain-text, public.content]
            UTTypeDescription: Couch Care Card
            UTTypeTagSpecification:
              public.filename-extension: [couchstain]
  CouchStainTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CouchStainTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  CouchStainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CouchStainUITests]
    dependencies:
      - target: CouchStain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CouchStain
schemes:
  CouchStain:
    build:
      targets:
        CouchStain: all
        CouchStainTests: [test]
    test:
      config: Debug
      targets: [CouchStainTests]
  CouchStainUI:
    build:
      targets:
        CouchStain: all
        CouchStainUITests: [test]
    test:
      config: Debug
      targets: [CouchStainUITests]
